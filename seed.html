<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"/><title>Seed GeoSports Data</title></head>
<body>

<script>

  projectId: "geosports-scoreboard",

async function seedData(){
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  btn.disabled = true;
  btn.textContent = "Seeding...";
  status.innerHTML = "";
  try {
    await firebase.database().ref("scores").set(SEED);
    status.innerHTML = `<span style="color:#27ae60;font-weight:600">✅ Done! All scores loaded into Firebase.<br/>You can close this page.</span>`;
    btn.textContent = "Done!";
  } catch(e) {
    status.innerHTML = `<span style="color:#c0392b">Error: ${e.message}</span>`;
    btn.disabled = false;
    btn.textContent = "Try Again";
  }
}
</script>
