<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GeoSports Scoreboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh;color:#1a1a1a}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
header h1{font-size:24px;font-weight:600;color:#1a1a1a}
header h1 span{color:#4472C4}
.admin-btn{background:none;border:1.5px solid #ccc;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;color:#555;display:flex;align-items:center;gap:6px}
.admin-btn:hover{border-color:#4472C4;color:#4472C4}
.tabs{display:flex;gap:0;background:#fff;border-radius:10px;border:1px solid #e0e0e0;padding:4px;margin-bottom:1.5rem;width:fit-content}
.tab{padding:7px 20px;border-radius:7px;border:none;background:none;font-size:14px;cursor:pointer;color:#666;font-weight:500}
.tab.active{background:#4472C4;color:#fff}
.card{background:#fff;border-radius:12px;border:1px solid #e8e8e8;padding:1.25rem;margin-bottom:1rem;overflow-x:auto}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:500px}
th{padding:8px 10px;text-align:center;font-weight:600;font-size:12px;color:#888;border-bottom:1.5px solid #f0f0f0;white-space:nowrap}
th.name-col{text-align:left;position:sticky;left:0;z-index:3;background:#fff}
td{padding:7px 10px;text-align:center;border-bottom:1px solid #f5f5f5}
tr:last-child td{border-bottom:none}
td.name-col{text-align:left;font-weight:600;position:sticky;left:0;z-index:2;background:#fff}
.score-chip{display:inline-block;padding:2px 8px;border-radius:5px;font-weight:700;min-width:42px}
.chip-gold{background:#FFD700;color:#000}
.chip-brown{background:#8B4513;color:#fff}
.chip-green{background:#00CC44;color:#fff}
.chip-orange{background:#FF6600;color:#fff}
.chip-plain{background:transparent;color:#1a1a1a}
.winner-row td{background:#fffbea;}
.winner-row td.name-col{background:#fffbea;font-size:12px;font-weight:600}
.dash{color:#bbb}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1rem}
@media(max-width:500px){.stat-row{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border-radius:10px;border:1px solid #e8e8e8;padding:12px;text-align:center}
.stat-label{font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.stat-value{font-size:26px;font-weight:600}
.lock{text-align:center;padding:3rem 1rem}
.lock-icon{font-size:48px;margin-bottom:1rem}
.lock p{color:#888;font-size:14px;margin-bottom:1rem}
.lock input{width:100%;max-width:260px;padding:10px 14px;border-radius:8px;border:1.5px solid #ddd;font-size:15px;text-align:center;outline:none;margin-bottom:8px}
.lock input:focus{border-color:#4472C4}
.err{color:#c0392b;font-size:13px}
.btn{padding:9px 22px;border-radius:8px;border:1.5px solid #ddd;font-size:14px;cursor:pointer;background:#fff;color:#333;font-weight:500}
.btn:hover{background:#f5f5f5}
.btn-primary{background:#4472C4;color:#fff;border-color:#4472C4}
.btn-primary:hover{background:#3460b0}
.btn-danger{background:#fff0f0;color:#c0392b;border-color:#f5c6c6}
.btn-danger:hover{background:#ffe0e0}
.entry-form{display:grid;gap:8px}
.entry-row{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:10px}
.entry-row label{font-size:14px;font-weight:600}
.entry-row input{padding:8px 10px;border-radius:7px;border:1.5px solid #ddd;font-size:14px;outline:none;width:100%}
.entry-row input:focus{border-color:#4472C4}
.date-selector{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.date-selector label{font-size:14px;font-weight:600;color:#444}
.date-selector input{padding:8px 12px;border-radius:7px;border:1.5px solid #ddd;font-size:14px;outline:none}
.date-selector input:focus{border-color:#4472C4}
.form-actions{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;padding:4px 0}
.msg.success{color:#27ae60}
.msg.error{color:#c0392b}
.date-list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.date-list-item:last-child{border-bottom:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#666}
.legend-dot{width:12px;height:12px;border-radius:3px}
.rank-badge{display:inline-block;background:#f0f0f0;color:#555;border-radius:5px;padding:2px 7px;font-size:12px;font-weight:700}
.rank-1{background:#FFD700;color:#000}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Geo<span>Sports</span> Scoreboard</h1>
    <button class="admin-btn" id="admin-btn" onclick="toggleAdmin()">🔒 Admin</button>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showTab('scoreboard')">Scoreboard</button>
    <button class="tab" onclick="showTab('recap')">Recap</button>
    <div id="admin-tab-wrap" style="display:none">
      <button class="tab" onclick="showTab('admin')">Admin</button>
    </div>
  </div>

  <div id="view-scoreboard"></div>
  <div id="view-recap" style="display:none"></div>
  <div id="view-admin" style="display:none"></div>
</div>

<script>
const PLAYERS = ["Adam","Dave","Donny","Jason","Ronnie","Yoni","Yosef","Zach"];
const PC = {
  Adam:  {bg:"#F4B8C1",fg:"#7B1E2E"},
  Dave:  {bg:"#B8D4F4",fg:"#1A3A6B"},
  Donny: {bg:"#B8F4C8",fg:"#1A5C2E"},
  Jason: {bg:"#F4E6B8",fg:"#6B4A1A"},
  Ronnie:{bg:"#E8B8F4",fg:"#4A1A6B"},
  Yoni:  {bg:"#F4D4B8",fg:"#6B3A1A"},
  Yosef: {bg:"#B8F4F4",fg:"#1A5C5C"},
  Zach:  {bg:"#F4F4B8",fg:"#5C5C1A"},
};
const ADMIN_PASS = "geosports2026";
const STORAGE_KEY = "geosports_scores_v1";
let adminUnlocked = false;
let activeTab = "scoreboard";

// Seed data from spreadsheet
const SEED = {"5/6/2026":{"Donny":959,"Jason":822,"Yoni":904,"Yosef":807},"5/7/2026":{"Dave":815,"Donny":894,"Jason":793,"Yoni":869,"Yosef":921},"5/8/2026":{"Adam":738,"Donny":871,"Yoni":752,"Yosef":656,"Zach":810},"5/9/2026":{"Adam":819,"Dave":858,"Donny":900,"Jason":619,"Ronnie":806,"Yoni":698,"Yosef":759,"Zach":860},"5/10/2026":{"Donny":824,"Yoni":769,"Yosef":771,"Zach":847}};

function loadScores(){
  try{
    const s = localStorage.getItem(STORAGE_KEY);
    if(s) return JSON.parse(s);
  }catch(e){}
  // First load — seed with spreadsheet data
  localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED));
  return SEED;
}

function saveScores(s){ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

function getDates(s){ return Object.keys(s).sort((a,b)=>new Date(a)-new Date(b)); }

function allVals(s){ return Object.values(s).flatMap(d=>Object.values(d)).filter(v=>v!=null); }

function playerScores(s,name){ return getDates(s).map(d=>s[d]?.[name]).filter(v=>v!=null); }

function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }

function showTab(name){
  activeTab = name;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  const idx = ["scoreboard","recap","admin"].indexOf(name);
  document.querySelectorAll(".tab")[idx]?.classList.add("active");
  ["scoreboard","recap","admin"].forEach(t=>{
    document.getElementById("view-"+t).style.display = t===name?"block":"none";
  });
  if(name==="scoreboard") renderScoreboard();
  if(name==="recap") renderRecap();
  if(name==="admin") renderAdmin();
}

function toggleAdmin(){
  document.getElementById("admin-tab-wrap").style.display = "block";
  showTab("admin");
}

// ── SCOREBOARD ──
function renderScoreboard(){
  const s = loadScores();
  const dates = getDates(s);
  const all = allVals(s);
  const ATH = all.length ? Math.max(...all) : null;
  const ATL = all.length ? Math.min(...all) : null;

  let html = "";

  if(all.length){
    html += `<div class="stat-row">
      <div class="stat"><div class="stat-label">All-time high</div><div class="stat-value" style="color:#B8860B">${ATH}</div></div>
      <div class="stat"><div class="stat-label">All-time low</div><div class="stat-value" style="color:#8B4513">${ATL}</div></div>
      <div class="stat"><div class="stat-label">Days played</div><div class="stat-value">${dates.length}</div></div>
    </div>`;
  }

  html += `<div class="card">`;

  if(!dates.length){
    html += `<p style="color:#aaa;text-align:center;padding:2rem">No scores yet.</p>`;
  } else {
    html += `<table><thead><tr><th class="name-col">Player</th>`;
    dates.forEach(d=>{
      const parts = d.split("/");
      html += `<th>${parts[0]}/${parts[1]}</th>`;
    });
    html += `</tr></thead><tbody>`;

    PLAYERS.forEach(name=>{
      const ps = playerScores(s, name);
      const pb = ps.length ? Math.max(...ps) : null;
      const pl = ps.length ? Math.min(...ps) : null;
      const c = PC[name];
      html += `<tr><td class="name-col" style="color:${c.fg}">${name}</td>`;
      dates.forEach(d=>{
        const v = s[d]?.[name];
        if(v==null){ html+=`<td><span class="dash">—</span></td>`; return; }
        let cls = "score-chip ";
        if(v===ATH) cls+="chip-gold";
        else if(v===ATL) cls+="chip-brown";
        else if(v===pb) cls+="chip-green";
        else if(v===pl) cls+="chip-orange";
        else cls+="chip-plain";
        html += `<td><span class="${cls}">${v}</span></td>`;
      });
      html += `</tr>`;
    });

    // Daily winner row
    html += `<tr class="winner-row"><td class="name-col">🏆 Daily winner</td>`;
    dates.forEach(d=>{
      const day = s[d]||{};
      let best=-1, winner="—";
      Object.entries(day).forEach(([n,v])=>{ if(v>best){best=v;winner=n;} });
      const c = winner!=="—" ? PC[winner] : null;
      html += `<td style="${c?`color:${c.fg}`:"color:#bbb"}">${winner}</td>`;
    });
    html += `</tr></tbody></table>`;

    html += `<div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#FFD700"></div>All-time high</div>
      <div class="legend-item"><div class="legend-dot" style="background:#8B4513"></div>All-time low</div>
      <div class="legend-item"><div class="legend-dot" style="background:#00CC44"></div>Personal best</div>
      <div class="legend-item"><div class="legend-dot" style="background:#FF6600"></div>Personal low</div>
    </div>`;
  }

  html += `</div>`;
  document.getElementById("view-scoreboard").innerHTML = html;
}

// ── RECAP ──
function renderRecap(){
  const s = loadScores();
  const all = allVals(s);
  if(!all.length){
    document.getElementById("view-recap").innerHTML=`<div class="card"><p style="color:#aaa;text-align:center;padding:2rem">No data yet.</p></div>`;
    return;
  }

  const maxBest = Math.max(...PLAYERS.map(n=>{ const ps=playerScores(s,n); return ps.length?Math.max(...ps):-Infinity; }));
  const minLow  = Math.min(...PLAYERS.map(n=>{ const ps=playerScores(s,n); return ps.length?Math.min(...ps):Infinity; }));

  const stats = PLAYERS.map(name=>{
    const ps = playerScores(s, name);
    const wins = getDates(s).filter(d=>{
      const day=s[d]||{}; let best=-1,w=null;
      Object.entries(day).forEach(([n,v])=>{if(v>best){best=v;w=n;}});
      return w===name;
    }).length;
    return { name, avg:avg(ps), best:ps.length?Math.max(...ps):null, low:ps.length?Math.min(...ps):null, wins, count:ps.length };
  }).filter(p=>p.avg!=null).sort((a,b)=>b.avg-a.avg);

  const maxWins = Math.max(...stats.map(p=>p.wins));

  let html = `<div class="card"><table>
    <thead><tr>
      <th class="name-col">Player</th>
      <th>Avg</th><th>Rank</th><th>Best</th><th>Low</th><th>Wins</th><th>Days</th>
    </tr></thead><tbody>`;

  stats.forEach((p,i)=>{
    const c = PC[p.name];
    const bestCls = p.best===maxBest ? "chip-gold" : "";
    const lowCls  = p.low===minLow  ? "chip-brown" : "";
    const winStyle = p.wins===maxWins&&p.wins>0 ? "color:#B8860B;font-weight:700" : "color:#888";
    html += `<tr>
      <td class="name-col" style="color:${c.fg}">${p.name}</td>
      <td><span style="background:${c.bg};color:${c.fg};padding:2px 8px;border-radius:5px;font-weight:700">${p.avg.toFixed(2)}</span></td>
      <td><span class="rank-badge ${i===0?'rank-1':''}">#${i+1}</span></td>
      <td><span class="score-chip ${bestCls}">${p.best??'—'}</span></td>
      <td><span class="score-chip ${lowCls}">${p.low??'—'}</span></td>
      <td style="${winStyle}">${p.wins}</td>
      <td style="color:#888">${p.count}</td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  document.getElementById("view-recap").innerHTML = html;
}

// ── ADMIN ──
function renderAdmin(){
  if(!adminUnlocked){
    document.getElementById("view-admin").innerHTML = `
      <div class="card lock">
        <div class="lock-icon">🔒</div>
        <p>Admin access required</p>
        <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()"/>
        <br/>
        <button class="btn btn-primary" onclick="checkPw()">Unlock</button>
        <p class="err" id="pw-err"></p>
      </div>`;
    return;
  }

  const s = loadScores();
  const today = new Date().toLocaleDateString("en-US",{month:"numeric",day:"numeric",year:"numeric"});

  let html = `<div class="card">
    <div class="card-title">Enter scores</div>
    <div class="date-selector">
      <label>Date</label>
      <input type="date" id="score-date" onchange="prefillDate()"/>
    </div>
    <div class="entry-form">`;

  PLAYERS.forEach(name=>{
    const c = PC[name];
    html += `<div class="entry-row">
      <label style="color:${c.fg}">${name}</label>
      <input type="number" id="inp-${name}" placeholder="Score (0–1000)" min="0" max="1000"/>
    </div>`;
  });

  html += `</div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveDay()">Save scores</button>
      <button class="btn" onclick="clearDay()">Clear day</button>
      <span class="msg" id="save-msg"></span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">All dates</div>
    <div id="date-list"></div>
  </div>`;

  document.getElementById("view-admin").innerHTML = html;

  // Set today's date
  const now = new Date();
  document.getElementById("score-date").value = now.toISOString().split("T")[0];
  prefillDate();
  renderDateList();
}

function prefillDate(){
  const s = loadScores();
  const raw = document.getElementById("score-date").value;
  if(!raw) return;
  const [y,m,d] = raw.split("-");
  const key = `${parseInt(m)}/${parseInt(d)}/${y}`;
  PLAYERS.forEach(name=>{
    const inp = document.getElementById("inp-"+name);
    if(inp) inp.value = s[key]?.[name] ?? "";
  });
}

function getDateKey(){
  const raw = document.getElementById("score-date").value;
  if(!raw) return null;
  const [y,m,d] = raw.split("-");
  return `${parseInt(m)}/${parseInt(d)}/${y}`;
}

function saveDay(){
  const key = getDateKey();
  if(!key){ showMsg("Pick a date first.", "error"); return; }
  const s = loadScores();
  if(!s[key]) s[key]={};
  let count=0;
  PLAYERS.forEach(name=>{
    const v = document.getElementById("inp-"+name)?.value;
    if(v!==""&&v!=null){ s[key][name]=parseInt(v); count++; }
    else delete s[key][name];
  });
  if(!Object.keys(s[key]).length) delete s[key];
  saveScores(s);
  showMsg(`Saved ${count} score${count!==1?"s":""}.`, "success");
  renderDateList();
}

function clearDay(){
  const key = getDateKey();
  if(!key) return;
  const s = loadScores();
  delete s[key];
  saveScores(s);
  PLAYERS.forEach(name=>{ const inp=document.getElementById("inp-"+name); if(inp)inp.value=""; });
  showMsg("Day cleared.", "success");
  renderDateList();
}

function deleteDate(key){
  if(!confirm(`Delete all scores for ${key}?`)) return;
  const s = loadScores();
  delete s[key];
  saveScores(s);
  renderDateList();
}

function renderDateList(){
  const s = loadScores();
  const dates = getDates(s);
  const el = document.getElementById("date-list");
  if(!el) return;
  if(!dates.length){ el.innerHTML=`<p style="color:#aaa;font-size:13px">No dates yet.</p>`; return; }
  el.innerHTML = [...dates].reverse().map(d=>{
    const count = Object.keys(s[d]||{}).length;
    return `<div class="date-list-item">
      <span><strong>${d}</strong> <span style="color:#aaa">(${count} score${count!==1?"s":""})</span></span>
      <button class="btn btn-danger" style="padding:4px 12px;font-size:12px" onclick="deleteDate('${d}')">Delete</button>
    </div>`;
  }).join("");
}

function showMsg(text, type){
  const el = document.getElementById("save-msg");
  if(!el) return;
  el.textContent = text;
  el.className = "msg " + type;
  setTimeout(()=>el.textContent="", 3000);
}

function checkPw(){
  const v = document.getElementById("pw").value;
  if(v===ADMIN_PASS){ adminUnlocked=true; document.getElementById("admin-btn").textContent="🔓 Admin"; renderAdmin(); }
  else document.getElementById("pw-err").textContent="Incorrect password.";
}

// Init
renderScoreboard();
</script>
</body>
</html>
