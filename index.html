<style>
*{box-sizing:border-box;margin:0;padding:0;transition:background-color .2s,color .2s,border-color .2s}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* LIGHT MODE */
body.light{background:#f0f2f5;color:#1a1a1a}
body.light .card{background:#fff;border-color:#e8e8e8}
body.light .tabs{background:#fff;border-color:#e0e0e0}
body.light .tab{color:#666}
body.light .tab.active{background:#0A1628;color:#fff}
body.light th{background:#fff;color:#888;border-color:#f0f0f0}
body.light th.name-col{background:#fff;box-shadow:2px 0 4px rgba(0,0,0,0.06)}
body.light td{background:#fff;border-color:#f5f5f5;color:#1a1a1a}
body.light td.name-col{background:#fff;box-shadow:2px 0 4px rgba(0,0,0,0.06)}
body.light .winner-row td{background:#fffbea!important}
body.light .winner-row td.name-col{background:#fffbea!important}
body.light .stat{background:#fff;border-color:#e8e8e8}
body.light .stat-label{color:#888}
body.light .lock input{border-color:#ddd;background:#fff;color:#1a1a1a}
body.light .entry-row input{border-color:#ddd;background:#fff;color:#1a1a1a}
body.light .date-selector input{border-color:#ddd;background:#fff;color:#1a1a1a}
body.light .btn{background:#fff;color:#333;border-color:#ddd}
body.light .btn:hover{background:#f5f5f5}
body.light .date-list-item{border-color:#f0f0f0}
body.light .recap-card{background:#fff;border-color:#e8e8e8}
body.light .hs-card{background:#fff;border-color:#e8e8e8}
body.light .hs-row{border-color:#f5f5f5}
body.light .dark-toggle{background:#fff;border-color:#ddd;color:#555}

/* DARK MODE */
body.dark{background:#0f0f0f;color:#e8e8e8}
body.dark .card{background:#1a1a1a;border-color:#2a2a2a}
body.dark .tabs{background:#1a1a1a;border-color:#2a2a2a}
body.dark .tab{color:#888}
body.dark .tab.active{background:#4A90D9;color:#fff}
body.dark th{background:#1a1a1a;color:#666;border-color:#2a2a2a}
body.dark th.name-col{background:#1a1a1a;box-shadow:2px 0 6px rgba(0,0,0,0.4)}
body.dark td{background:#1a1a1a;border-color:#252525;color:#e8e8e8}
body.dark td.name-col{background:#1a1a1a;box-shadow:2px 0 6px rgba(0,0,0,0.4)}
body.dark .winner-row td{background:#1f1c0a!important}
body.dark .winner-row td.name-col{background:#1f1c0a!important}
body.dark .stat{background:#1a1a1a;border-color:#2a2a2a}
body.dark .stat-label{color:#666}
body.dark .lock input{border-color:#333;background:#222;color:#e8e8e8}
body.dark .entry-row input{border-color:#333;background:#222;color:#e8e8e8}
body.dark .date-selector input{border-color:#333;background:#222;color:#e8e8e8}
body.dark .btn{background:#222;color:#ccc;border-color:#333}
body.dark .btn:hover{background:#2a2a2a}
body.dark .date-list-item{border-color:#2a2a2a}
body.dark .recap-card{background:#1a1a1a;border-color:#2a2a2a}
body.dark .hs-card{background:#1a1a1a;border-color:#2a2a2a}
body.dark .hs-row{border-color:#252525}
body.dark .chip-plain{color:#e8e8e8}
body.dark .dark-toggle{background:#222;border-color:#333;color:#ccc}

.app{max-width:1100px;margin:0 auto;padding:1rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.dark-toggle{border:1.5px solid;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.logo-svg{width:100%;max-width:500px;display:block;margin:0 auto}
.admin-btn{display:block;margin:8px auto 0;background:none;border:1.5px solid #444;border-radius:8px;padding:5px 14px;font-size:12px;cursor:pointer;color:#aaa}
.admin-btn:hover{border-color:#4A90D9;color:#4A90D9}
.logo-wrap{margin-bottom:1.25rem}
.tabs{display:flex;gap:0;border-radius:10px;border:1px solid;padding:4px;margin-bottom:1.25rem;width:100%;overflow-x:auto}
.tab{padding:7px 16px;border-radius:7px;border:none;background:none;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap;flex:1}
.card{border-radius:12px;border:1px solid;padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:12px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13px;min-width:500px;width:100%}
th{padding:8px 10px;text-align:center;font-weight:600;font-size:12px;border-bottom:1.5px solid;white-space:nowrap}
th.name-col{text-align:left;position:sticky;left:0;z-index:3}
td{padding:7px 10px;text-align:center;border-bottom:1px solid}
tr:last-child td{border-bottom:none}
td.name-col{text-align:left;font-weight:600;position:sticky;left:0;z-index:2}
.winner-row td{font-size:12px;font-weight:600}
.score-chip{display:inline-block;padding:2px 8px;border-radius:5px;font-weight:700;min-width:42px}
.chip-gold{background:#FFD700;color:#000}
.chip-brown{background:#8B4513;color:#fff}
.chip-green{background:#00CC44;color:#fff}
.chip-orange{background:#FF6600;color:#fff}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1rem}
.stat{border-radius:10px;border:1px solid;padding:12px;text-align:center}
.stat-value{font-size:26px;font-weight:600}
.lock{text-align:center;padding:3rem 1rem}
.lock p{color:#888;font-size:14px;margin-bottom:1rem}
.lock input{width:100%;max-width:260px;padding:10px 14px;border-radius:8px;border:1.5px solid;font-size:15px;text-align:center;outline:none;margin:0 auto 8px;display:block}
.err{color:#c0392b;font-size:13px;margin-top:6px}
.btn{padding:9px 22px;border-radius:8px;border:1.5px solid;font-size:14px;cursor:pointer;font-weight:500}
.btn-primary{background:#0A1628!important;color:#fff!important;border-color:#0A1628!important}
.btn-primary:hover{background:#1a2d4a!important}
.btn-danger{background:#fff0f0!important;color:#c0392b!important;border-color:#f5c6c6!important}
.entry-form{display:grid;gap:8px}
.entry-row{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:10px}
.entry-row label{font-size:14px;font-weight:600}
.entry-row input{padding:8px 10px;border-radius:7px;border:1.5px solid;font-size:14px;outline:none;width:100%}
.date-selector{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.date-selector label{font-size:14px;font-weight:600}
.date-selector input{padding:8px 12px;border-radius:7px;border:1.5px solid;font-size:14px;outline:none}
.form-actions{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;padding:4px 0}
.msg.success{color:#27ae60}
.msg.error{color:#c0392b}
.date-list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid;font-size:13px}
.date-list-item:last-child{border-bottom:none}
.loading{text-align:center;padding:3rem;color:#aaa;font-size:14px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#27ae60;margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.recap-card{border-radius:12px;border:1px solid;padding:12px}
.hs-card{border-radius:12px;border:1px solid;padding:14px}
.hs-row{border-bottom:0.5px solid;padding:9px 0}
.hs-row:last-child{border-bottom:none}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDvzUc07MAv3RQv-QQMrj17ZS2bmd6qsRM",
  authDomain: "geosports-scoreboard.firebaseapp.com",
  databaseURL: "https://geosports-scoreboard-default-rtdb.firebaseio.com",
  projectId: "geosports-scoreboard",
  storageBucket: "geosports-scoreboard.firebasestorage.app",
  messagingSenderId: "908275741528",
  appId: "1:908275741528:web:8c03c411b17134793c6b2d"
});
const db = firebase.database();
const scoresRef = db.ref("scores");

const PLAYERS = ["Adam","Dave","Donny","Jason","Ronnie","Yoni","Yosef","Zach"];
const PC = {
  Adam:  {bg:"#F4B8C1",fg:"#7B1E2E"},
  Dave:  {bg:"#B8D4F4",fg:"#1A3A6B"},
  Donny: {bg:"#B8F4C8",fg:"#1A5C2E"},
  Jason: {bg:"#F4E6B8",fg:"#6B4A1A"},
  Ronnie:{bg:"#E8B8F4",fg:"#4A1A6B"},
  Yoni:  {bg:"#F4D4B8",fg:"#6B3A1A"},
  Yosef: {bg:"#B8F4F4",fg:"#1A5C5C"},
  Zach:  {bg:"#F4F4B8",fg:"#5C5C1A"},
};
const ADMIN_PASS = "geosports2026";
let adminUnlocked = false;
let activeTab = "scoreboard";
let liveScores = null;

// Dark mode
let isDark = localStorage.getItem("darkMode") === "true";
function applyTheme(){
  document.body.className = isDark ? "dark" : "light";
  document.getElementById("dark-btn").textContent = isDark ? "☀️ Light" : "🌙 Dark";
}
function toggleDark(){
  isDark = !isDark;
  localStorage.setItem("darkMode", isDark);
  applyTheme();
}
applyTheme();

scoresRef.on("value", snap => {
  liveScores = snap.val() || {};
  if(activeTab==="scoreboard") renderScoreboard();
  if(activeTab==="recap") renderRecap();
  if(activeTab==="highscores") renderHighScores();
  if(activeTab==="admin" && adminUnlocked) renderDateList();
});

function getScores(){ return liveScores || {}; }
function getDates(s){ return Object.keys(s).sort((a,b)=>new Date(a)-new Date(b)).reverse(); }
function allVals(s){ return Object.values(s).flatMap(d=>Object.values(d)).filter(v=>v!=null); }
function playerScores(s,name){ return Object.keys(s).sort((a,b)=>new Date(a)-new Date(b)).map(d=>s[d]?.[name]).filter(v=>v!=null); }
function avg(arr){ return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null; }

function showTab(name){
  activeTab=name;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  ["scoreboard","recap","highscores","admin"].forEach((t,i)=>{
    const el=document.getElementById("view-"+t);
    if(el) el.style.display=t===name?"block":"none";
    if(t===name) document.querySelectorAll(".tab")[i]?.classList.add("active");
  });
  if(name==="scoreboard") renderScoreboard();
  if(name==="recap") renderRecap();
  if(name==="highscores") renderHighScores();
  if(name==="admin") renderAdmin();
}

function toggleAdmin(){
  document.getElementById("admin-tab-wrap").style.display="block";
  showTab("admin");
}

function cardBg(){ return isDark?"#1a1a1a":"#fff"; }
function cardBorder(){ return isDark?"#2a2a2a":"#e8e8e8"; }
function textColor(){ return isDark?"#e8e8e8":"#1a1a1a"; }
function subColor(){ return isDark?"#666":"#888"; }

// ── SCOREBOARD ──
function renderScoreboard(){
  const s=getScores();
  const dates=getDates(s);
  const all=allVals(s);
  const ATH=all.length?Math.max(...all):null;
  const ATL=all.length?Math.min(...all):null;
  let html="";
  if(all.length){
    html+=`<div class="stat-row">
      <div class="stat"><div class="stat-label">All-time high</div><div class="stat-value" style="color:#B8860B">${ATH}</div></div>
      <div class="stat"><div class="stat-label">All-time low</div><div class="stat-value" style="color:#8B4513">${ATL}</div></div>
      <div class="stat"><div class="stat-label">Days played</div><div class="stat-value">${dates.length}</div></div>
    </div>`;
  }
  html+=`<div class="card"><div style="font-size:11px;color:#27ae60;margin-bottom:8px"><span class="live-dot"></span>Live — updates automatically</div>`;
  if(!dates.length){
    html+=`<p style="color:#aaa;text-align:center;padding:2rem">No scores yet.</p>`;
  } else {
    html+=`<div class="table-scroll"><table><thead><tr><th class="name-col">Player</th>`;
    dates.forEach(d=>{const p=d.split("-");html+=`<th>${p[0]}/${p[1]}</th>`;});
    html+=`</tr></thead><tbody>`;
    PLAYERS.forEach(name=>{
      const ps=playerScores(s,name);
      const pb=ps.length?Math.max(...ps):null;
      const pl=ps.length?Math.min(...ps):null;
      const c=PC[name];
      html+=`<tr><td class="name-col" style="color:${c.fg}">${name}</td>`;
      dates.forEach(d=>{
        const v=s[d]?.[name];
        if(v==null){html+=`<td style="color:#555">—</td>`;return;}
        let cls="score-chip ";
        if(v===ATH)cls+="chip-gold";
        else if(v===ATL)cls+="chip-brown";
        else if(v===pb)cls+="chip-green";
        else if(v===pl)cls+="chip-orange";
        else cls+="chip-plain";
        html+=`<td><span class="${cls}">${v}</span></td>`;
      });
      html+=`</tr>`;
    });
    html+=`<tr class="winner-row"><td class="name-col">🏆 Daily winner</td>`;
    dates.forEach(d=>{
      const day=s[d]||{};let best=-1,winner="—";
      Object.entries(day).forEach(([n,v])=>{if(v>best){best=v;winner=n;}});
      const c=winner!=="—"?PC[winner]:null;
      html+=`<td style="${c?`color:${c.fg}`:"color:#555"}">${winner}</td>`;
    });
    html+=`</tr></tbody></table></div>`;
    html+=`<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid ${cardBorder()}">
      <div style="display:flex;align-items:center;gap:5px;font-size:12px"><div style="width:12px;height:12px;border-radius:3px;background:#FFD700"></div>All-time high</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:12px"><div style="width:12px;height:12px;border-radius:3px;background:#8B4513"></div>All-time low</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:12px"><div style="width:12px;height:12px;border-radius:3px;background:#00CC44"></div>Personal best</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:12px"><div style="width:12px;height:12px;border-radius:3px;background:#FF6600"></div>Personal low</div>
    </div>`;
  }
  html+=`</div>`;
  document.getElementById("view-scoreboard").innerHTML=html;
}

// ── RECAP ──
function renderRecap(){
  const s=getScores();
  const all=allVals(s);
  if(!all.length){document.getElementById("view-recap").innerHTML=`<div class="card"><p style="color:#aaa;text-align:center;padding:2rem">No data yet.</p></div>`;return;}
  const maxBest=Math.max(...PLAYERS.map(n=>{const ps=playerScores(s,n);return ps.length?Math.max(...ps):-Infinity;}));
  const minLow=Math.min(...PLAYERS.map(n=>{const ps=playerScores(s,n);return ps.length?Math.min(...ps):Infinity;}));
  const stats=PLAYERS.map(name=>{
    const ps=playerScores(s,name);
    const wins=Object.keys(s).filter(d=>{const day=s[d]||{};let best=-1,w=null;Object.entries(day).forEach(([n,v])=>{if(v>best){best=v;w=n;}});return w===name;}).length;
    return{name,avg:avg(ps),best:ps.length?Math.max(...ps):null,low:ps.length?Math.min(...ps):null,wins,count:ps.length};
  }).filter(p=>p.avg!=null).sort((a,b)=>b.avg-a.avg);
  const maxWins=Math.max(...stats.map(p=>p.wins));
  let html=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">`;
  stats.forEach((p,i)=>{
    const c=PC[p.name];
    const bestCls=p.best===maxBest?"chip-gold":"";
    const lowCls=p.low===minLow?"chip-brown":"";
    const winColor=p.wins===maxWins&&p.wins>0?"#B8860B":"#aaa";
    const winWeight=p.wins===maxWins&&p.wins>0?"700":"400";
    const rankBg=i===0?"#FFD700":i===1?"#C0C0C0":i===2?"#CD7F32":"#333";
    const rankFg=i<3?"#000":"#aaa";
    html+=`<div class="recap-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span style="font-weight:700;font-size:15px;color:${c.fg}">${p.name}</span>
        <span style="background:${rankBg};color:${rankFg};padding:2px 8px;border-radius:6px;font-weight:700;font-size:12px">#${i+1}</span>
      </div>
      <div style="background:${c.bg};border-radius:8px;padding:6px 10px;text-align:center;margin-bottom:8px">
        <div style="font-size:11px;color:${c.fg};opacity:0.7;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Avg Score</div>
        <div style="font-size:20px;font-weight:700;color:${c.fg}">${p.avg.toFixed(2)}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;text-align:center">
        <div><div style="font-size:10px;color:#aaa;font-weight:600;text-transform:uppercase">Best</div><span class="score-chip ${bestCls}" style="font-size:12px;min-width:auto">${p.best??'—'}</span></div>
        <div><div style="font-size:10px;color:#aaa;font-weight:600;text-transform:uppercase">Low</div><span class="score-chip ${lowCls}" style="font-size:12px;min-width:auto">${p.low??'—'}</span></div>
        <div><div style="font-size:10px;color:#aaa;font-weight:600;text-transform:uppercase">Wins</div><div style="font-size:14px;font-weight:${winWeight};color:${winColor}">${p.wins}</div></div>
      </div>
    </div>`;
  });
  html+=`</div>`;
  document.getElementById("view-recap").innerHTML=html;
}

// ── HIGH SCORES ──
function renderHighScores(){
  const s=getScores();
  const all=allVals(s);
  if(!all.length){document.getElementById("view-highscores").innerHTML=`<div class="card"><p style="color:#aaa;text-align:center;padding:2rem">No scores yet.</p></div>`;return;}
  const entries=[];
  Object.keys(s).sort((a,b)=>new Date(a)-new Date(b)).forEach(d=>{
    Object.entries(s[d]||{}).forEach(([name,score])=>{
      const p=d.split("-");entries.push({score,name,date:`${p[0]}/${p[1]}`});
    });
  });
  entries.sort((a,b)=>b.score-a.score);
  const top=entries[0];
  const totalDays=Object.keys(s).length;
  let html=`<div style="display:flex;gap:8px;margin-bottom:14px">
    <div class="hs-card" style="flex:1;text-align:center">
      <div style="font-size:10px;color:#aaa;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Top score</div>
      <div style="font-size:22px;font-weight:600">${top.score}</div>
      <div style="font-size:11px;color:#aaa">${top.name} &middot; ${top.date}</div>
    </div>
    <div class="hs-card" style="flex:1;text-align:center">
      <div style="font-size:10px;color:#aaa;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Entries</div>
      <div style="font-size:22px;font-weight:600">${entries.length}</div>
      <div style="font-size:11px;color:#aaa">across ${totalDays} day${totalDays!==1?"s":""}</div>
    </div>
  </div>
  <div class="hs-card">
    <div style="max-width:320px;margin:0 auto">
      <div style="display:grid;grid-template-columns:80px 120px 80px;font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.04em;padding:0 0 8px;border-bottom:1.5px solid ${cardBorder()};text-align:center">
        <span>Score</span><span>Player</span><span>Date</span>
      </div>`;
  entries.forEach((e,i)=>{
    const c=PC[e.name];
    const isTop=i===0;
    html+=`<div class="hs-row" style="display:grid;grid-template-columns:80px 120px 80px;align-items:center;text-align:center;background:${isTop?"rgba(255,215,0,0.1)":"transparent"}">
      <span style="font-size:17px;font-weight:600;color:${isTop?"#B8860B":textColor()}">${e.score}</span>
      <div style="display:flex;align-items:center;justify-content:center;gap:6px">
        <span style="width:8px;height:8px;border-radius:50%;background:${c.fg};flex-shrink:0"></span>
        <span style="font-size:14px;font-weight:500">${e.name}</span>
      </div>
      <span style="font-size:13px;color:#aaa">${e.date}</span>
    </div>`;
  });
  html+=`</div></div>`;
  document.getElementById("view-highscores").innerHTML=html;
}

// ── ADMIN ──
function renderAdmin(){
  if(!adminUnlocked){
    document.getElementById("view-admin").innerHTML=`
      <div class="card lock">
        <div style="font-size:48px;margin-bottom:1rem">🔒</div>
        <p>Admin access required</p>
        <input type="password" id="pw" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()"/>
        <br/><br/>
        <button class="btn btn-primary" onclick="checkPw()">Unlock</button>
        <p class="err" id="pw-err"></p>
      </div>`;
    return;
  }
  let html=`<div class="card">
    <div class="card-title"><span class="live-dot"></span>Enter scores</div>
    <div class="date-selector">
      <label>Date</label>
      <input type="date" id="score-date" onchange="prefillDate()"/>
    </div>
    <div class="entry-form">`;
  PLAYERS.forEach(name=>{
    const c=PC[name];
    html+=`<div class="entry-row"><label style="color:${c.fg}">${name}</label><input type="number" id="inp-${name}" placeholder="Score" min="0" max="1000"/></div>`;
  });
  html+=`</div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="saveDay()">Save scores</button>
      <button class="btn" onclick="clearDay()">Clear day</button>
      <span class="msg" id="save-msg"></span>
    </div>
  </div>
  <div class="card"><div class="card-title">All dates</div><div id="date-list"></div></div>`;
  document.getElementById("view-admin").innerHTML=html;
  document.getElementById("score-date").value=new Date().toISOString().split("T")[0];
  prefillDate();
  renderDateList();
}

function prefillDate(){
  const s=getScores();
  const raw=document.getElementById("score-date").value;
  if(!raw)return;
  const [y,m,d]=raw.split("-");
  const key=`${parseInt(m)}-${parseInt(d)}-${y}`;
  PLAYERS.forEach(name=>{
    const inp=document.getElementById("inp-"+name);
    if(inp) inp.value=s[key]?.[name]??"";
  });
}

function getDateKey(){
  const raw=document.getElementById("score-date").value;
  if(!raw)return null;
  const [y,m,d]=raw.split("-");
  return `${parseInt(m)}-${parseInt(d)}-${y}`;
}

function saveDay(){
  const key=getDateKey();
  if(!key){showMsg("Pick a date.","error");return;}
  const update={};let count=0;
  PLAYERS.forEach(name=>{
    const v=document.getElementById("inp-"+name)?.value;
    if(v!==""){update[name]=parseInt(v);count++;}
  });
  if(count===0){scoresRef.child(key).remove();}
  else{scoresRef.child(key).set(update);}
  showMsg(`Saved ${count} score${count!==1?"s":""}.`,"success");
}

function clearDay(){
  const key=getDateKey();
  if(!key)return;
  scoresRef.child(key).remove();
  PLAYERS.forEach(name=>{const inp=document.getElementById("inp-"+name);if(inp)inp.value="";});
  showMsg("Day cleared.","success");
}

function renderDateList(){
  const s=getScores();
  const dates=Object.keys(s).sort((a,b)=>new Date(b)-new Date(a));
  const el=document.getElementById("date-list");
  if(!el)return;
  if(!dates.length){el.innerHTML=`<p style="color:#aaa;font-size:13px">No dates yet.</p>`;return;}
  el.innerHTML=dates.map(d=>{
    const count=Object.keys(s[d]||{}).length;
    const p=d.split("-");
    return `<div class="date-list-item">
      <span><strong>${p[0]}/${p[1]}/${p[2]}</strong> <span style="color:#aaa">(${count} score${count!==1?"s":""})</span></span>
      <button class="btn btn-danger" style="padding:4px 12px;font-size:12px" onclick="deleteDate('${d}')">Delete</button>
    </div>`;
  }).join("");
}

function deleteDate(d){
  if(!confirm(`Delete all scores for ${d}?`))return;
  scoresRef.child(d).remove();
}

function showMsg(text,type){
  const el=document.getElementById("save-msg");
  if(!el)return;
  el.textContent=text;el.className="msg "+type;
  setTimeout(()=>el.textContent="",3000);
}

function checkPw(){
  const v=document.getElementById("pw").value;
  if(v===ADMIN_PASS){adminUnlocked=true;document.getElementById("admin-btn").textContent="🔓 Admin";renderAdmin();}
  else document.getElementById("pw-err").textContent="Incorrect password.";
}
</script>
</body>
</html>
